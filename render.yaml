# Render Free plan ucretsiz site (Web Service) icin:
# NOT: Free planda kalici disk YOKTUR. Yeniden baslatma/deploy sonrasi
# oturum dosyalari silinir ve QR'i tekrar okutmaniz gerekir.
# 7/24 icin cron-job.org gibi ucretsiz bir servisle /api/status'a
# her 10-14 dakikada bir istek atin (uyku modu engellenir).
services:
  - type: web
    name: whatsapp-asistan
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: PANEL_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: OWNER_NAME
        sync: false
      - key: DATA_DIR
        value: /data
